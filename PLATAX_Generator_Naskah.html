<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generator Naskah PLATAX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sidebar of steps + single working column; PLATAX blue is the only strong colour. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#0E2230; --muted:#566B79; --line:#D3DCE3; --line-strong:#B3C1CC;
  --accent:#007BB8; --accent-ink:#FFFFFF; --accent-soft:#E2F1F8; --accent-text:#00608F;
  --need:#A83A2B; --need-soft:#FBEAE6; --tip:#8A5A00; --tip-soft:#FBF1DC; --ok:#1C7A4F; --ok-soft:#E2F3EA;
  --font-display:'Source Serif 4',Cambria,Georgia,serif; --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hdr:60px;
  --font-mono:ui-monospace,'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1822; --surface:#102430; --ink:#E5EEF3; --muted:#92A7B5; --line:#25404F; --line-strong:#38586A;
  --accent:#4DB6E6; --accent-ink:#06202D; --accent-soft:#123647; --accent-text:#7CCBEE;
  --need:#F0907F; --need-soft:#3A1E1A; --tip:#E6B864; --tip-soft:#3A2D12; --ok:#6FD0A0; --ok-soft:#12352A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1822; --surface:#102430; --ink:#E5EEF3; --muted:#92A7B5; --line:#25404F; --line-strong:#38586A;
  --accent:#4DB6E6; --accent-ink:#06202D; --accent-soft:#123647; --accent-text:#7CCBEE;
  --need:#F0907F; --need-soft:#3A1E1A; --tip:#E6B864; --tip-soft:#3A2D12; --ok:#6FD0A0; --ok-soft:#12352A; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.55rem;margin-bottom:6px}
h3{font-size:1.1rem}
p{margin:0 0 10px}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .wrap{display:flex;gap:12px;align-items:center;min-height:calc(var(--hdr) - 20px)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand b{font:600 1.15rem var(--font-display)}
.brand span{color:var(--muted);font-size:.82rem}
.save-state{font-size:.8rem;color:var(--muted)}
.save-state.warn{color:var(--tip)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-text)}
.btn[disabled]{opacity:.55;cursor:progress}
.warnbar{background:var(--tip-soft);color:var(--tip);font-size:.82rem;padding:6px 0;border-bottom:1px solid var(--line)}
.warnbar .wrap{display:flex;gap:8px;align-items:center}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;margin-top:24px;align-items:start}
.steps{position:sticky;top:calc(var(--hdr) + 16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.steps button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.92rem;color:var(--muted)}
.steps button:hover{background:var(--accent-soft);color:var(--ink)}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:11px;line-height:1;font-weight:700}
.dot.need{border-color:var(--need)}
.dot.tip{border-color:var(--tip);background:var(--tip-soft);color:var(--tip)}
.dot.ok{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.main{min-width:0;max-width:780px}
.main>section{display:none}
.main>section.on{display:block}
.lead{color:var(--muted);margin-bottom:18px;max-width:62ch}

/* forms */
.field{margin:0 0 16px}
.field>label,.lbl{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
.hint{color:var(--muted);font-size:.82rem;margin-top:3px}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.counter{display:block;text-align:right;font:.78rem var(--font-mono);color:var(--muted);margin:-12px 0 16px}
.counter.over{color:var(--tip)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.card h3{margin-bottom:8px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{border:1px solid var(--line-strong);border-radius:8px;padding:12px;background:var(--surface);cursor:pointer;display:block}
.choice:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice input{margin-right:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:.9rem;font-weight:400}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:12px;font-size:.92rem}
.note b{display:block;margin-bottom:2px}
.note.tipn{border-color:var(--tip);background:var(--tip-soft)}

/* rich toolbar */
.rich{position:sticky;top:calc(var(--hdr) + 8px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:16px}
.rich .lab{font-size:.76rem;color:var(--muted);margin-right:4px}
.rich button{min-width:30px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;font-size:.88rem;padding:0 6px}
.rich button:hover{border-color:var(--accent)}
.rich .sep{width:1px;height:20px;background:var(--line);margin:0 4px}

/* blocks */
details.sec{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
details.sec>summary{cursor:pointer;padding:12px 16px;font:600 1.05rem var(--font-display);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary small{font:400 .8rem var(--font-body);color:var(--muted)}
.sec-body{padding:0 16px 16px}
.block{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;border-top:1px dashed var(--line);padding:12px 0}
.block .tag{font:.72rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text);margin-bottom:3px}
.block .ctl{display:flex;gap:2px}
.ctl button{border:1px solid transparent;background:transparent;border-radius:5px;width:28px;height:28px;cursor:pointer;color:var(--muted)}
.ctl button:hover{border-color:var(--line-strong);color:var(--ink)}
.addrow{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.grid{overflow-x:auto;margin:6px 0}
.grid table{border-collapse:collapse}
.grid td{padding:0}
.grid input{min-width:92px;border-radius:0;border:1px solid var(--line);padding:5px 7px;font-size:.86rem}
.thumb{max-width:220px;max-height:140px;border:1px solid var(--line);border-radius:4px;display:block;margin:6px 0}

/* authors */
.person{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--surface)}
.person header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.person header b{margin-right:auto;font-family:var(--font-display)}

/* check list */
.cl{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.cl li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:6px;font-size:.92rem}
.cl li.need{background:var(--need-soft)}
.cl li.tip{background:var(--tip-soft)}
.cl .go{margin-left:auto;flex:none}
.tagk{flex:none;font:600 .7rem var(--font-mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;margin-top:2px}
.need .tagk{background:var(--need);color:var(--surface)}
.tip .tagk{background:var(--tip);color:var(--surface)}
.okbox{background:var(--ok-soft);color:var(--ok);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-weight:500}
.dl{display:grid;gap:10px}
.dl .item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.dl .item div{flex:1 1 260px;min-width:0}
.dl .item small{color:var(--muted);display:block}
pre.out{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;font:.8rem/1.45 var(--font-mono);max-height:220px;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:40;max-width:90vw}
.help{font-size:.85rem;color:var(--muted)}
.help code{font-family:var(--font-mono);background:var(--accent-soft);padding:0 4px;border-radius:3px;color:var(--ink)}
.ref-ex{font-size:.82rem;font-family:var(--font-display);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.tpl{display:flex;flex-wrap:wrap;gap:6px}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px}
  .steps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px;gap:4px}
  .steps button{width:auto;white-space:nowrap;border:1px solid var(--line);padding:6px 10px}
  .top .wrap{flex-wrap:nowrap;gap:8px}
  .brand b{font-size:1rem}
  .btn.hd{padding:6px 9px}
  .long{display:none}
  .save-state{display:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand"><b>Generator Naskah PLATAX</b><span>Jurnal Ilmiah PLATAX · Template 2026</span></div>
  <span class="save-state" id="saveState" role="status"></span>
  <button class="btn hd" id="btnSaveDraft" type="button">Simpan<span class="long">&nbsp;draf</span></button>
  <button class="btn hd" id="btnLoadDraft" type="button">Muat<span class="long">&nbsp;draf</span></button>
  <input type="file" id="fileDraft" accept=".json,application/json" hidden>
</div></div>
<div class="warnbar"><div class="wrap"><span aria-hidden="true">⚠</span><span>Jangan tutup atau muat ulang halaman sebelum mengunduh draf.<span class="long"> Isian juga disimpan otomatis di browser ini, tetapi berkas draf adalah cadangan yang aman.</span></span></div></div>

<div class="wrap shell">
  <nav aria-label="Langkah"><ol class="steps" id="steps"></ol></nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

  /* ---------- manuscript type and corresponding-author country ---------- */
  const TYPES = {

    short: { id: 'Komunikasi Singkat', en: 'Short Communication', abs: [100, 150], refs: 15, mast: 'KOMUNIKASI SINGKAT / SHORT COMMUNICATION' },
    review: { id: 'Artikel Ulasan', en: 'Review Article', abs: [200, 300], refs: 50, mast: 'ARTIKEL ULASAN / REVIEW ARTICLE' }

  function sectBreak(cols, parts) {

  function tableXml(blk, full) {
    let rows = (blk.rows || []).map(r => r.map(c => clean(c)));

        `<w:bookmarkStart w:id="${1000 + i}" w:name="ref_${i + 1}"/>${inline(r, { sz: 15 }, { doi: true })}<w:bookmarkEnd w:id="${1000 + i}"/></w:p>`;

  function abstractTable(S, L) {

      `<w:tc><w:tcPr><w:tcW w:w="10450" w:type="dxa"/><w:tcBorders><w:top w:val="single" w:sz="${top}" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="${bot}" w:space="0" w:color="000000"/></w:tcBorders></w:tcPr>` +
      para(run(label, { b: true, sz: 16 }), { before: 0, after: 60 }) +

      para(run(kwl, { b: true, sz: 16 }) + inline(kw, { sz: 16 }), { before: 0, after: 80, jc: 'both' }) + '</w:tc>';
    return `<w:tbl><w:tblPr><w:tblW w:w="10450" w:type="dxa"/><w:jc w:val="left"/><w:tblInd w:w="0" w:type="dxa"/><w:tblLayout w:type="fixed"/>` +
      `<w:tblCellMar><w:top w:w="140" w:type="dxa"/><w:left w:w="180" w:type="dxa"/><w:bottom w:w="140" w:type="dxa"/><w:right w:w="180" w:type="dxa"/></w:tblCellMar>` +
      `<w:tblLook w:val="04a0" w:noHBand="0" w:noVBand="1" w:firstColumn="1" w:lastRow="0" w:lastColumn="0" w:firstRow="1"/></w:tblPr><w:tblGrid><w:gridCol w:w="10450"/></w:tblGrid>` +
      `<w:tr><w:trPr></w:trPr>${cell(8, withId ? 4 : 8, 'Abstract', S.absEn, 'Keywords: ', kwE)}</w:tr>` +
      (withId ? `<w:tr><w:trPr></w:trPr>${cell(4, 8, 'Abstrak', S.absId, 'Kata kunci: ', kwI)}</w:tr>` : '') + '</w:tbl>';
  }

  /* ---------- package helpers ---------- */
  async function openTpl(b64) { return JSZip.loadAsync(b64, { base64: true }); }
  async function finish(zip, S, titleForMeta, blind) {
    try {
      let c = await zip.file('docProps/core.xml').async('string');
      const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
      c = c.replace(/<dc:title>.*?<\/dc:title>/s, `<dc:title>${esc(stripMarkup(titleForMeta || ''))}</dc:title>`)
        .replace(/(<dcterms:modified[^>]*>).*?(<\/dcterms:modified>)/s, `$1${now}$2`)
        .replace(/<cp:lastModifiedBy>.*?<\/cp:lastModifiedBy>/s, '<cp:lastModifiedBy></cp:lastModifiedBy>');
      if (blind) c = c.replace(/<dc:creator>.*?<\/dc:creator>/s, '<dc:creator></dc:creator>');
      zip.file('docProps/core.xml', c);
    } catch (e) { }
    if (blind) { try { const ap = zip.file('docProps/app.xml'); if (ap) { let a = await ap.async('string'); a = a.replace(/<Company>.*?<\/Company>/s, '<Company></Company>').replace(/<Manager>.*?<\/Manager>/s, '<Manager></Manager>'); zip.file('docProps/app.xml', a); } } catch (e) { } }
    return zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  }

  async function buildManuscript(S, TPL, kind) {
    const blind = kind === 'blind';
    const L = LBL[S.lang === 'en' ? 'en' : 'id'];
    const key = blind ? (S.lang === 'en' ? 'ben' : 'bid') : (S.lang === 'en' ? 'en' : 'id');
    const zip = await openTpl(TPL[key]);
    let d = await zip.file('word/document.xml').async('string');
    const bodyOpen = d.indexOf('<w:body>') + 8;
    const vi = d.indexOf('PLATAX Vol.'); if (vi < 0) throw new Error('Penanda kop tidak ditemukan');
    const mStart = d.lastIndexOf('<w:p>', vi);
    const ei = d.indexOf('e-ISSN', vi);
    const mEnd = d.indexOf('</w:tbl>', ei) + 8;
    const sb = /<w:p><w:pPr><w:sectPr>.*?<\/w:sectPr><\/w:pPr><\/w:p>/s.exec(d.slice(mEnd));
    if (!sb) throw new Error('Pemisah bagian tidak ditemukan');
    const finalIdx = d.lastIndexOf('<w:sectPr');
    let finalSect = d.slice(finalIdx, d.indexOf('</w:body>'));
    const parts = {
      pgSz: (finalSect.match(/<w:pgSz[^>]*\/>/) || [''])[0], pgMar: (finalSect.match(/<w:pgMar[^>]*\/>/) || [''])[0],
      grid: (finalSect.match(/<w:docGrid[^>]*\/>/) || [''])[0]
    };
    const ctx = { media: [], imgN: 0, parts, fullUsed: false };
    const body = bodyXml(S, L, blind, ctx);
    if (ctx.fullUsed) finalSect = finalSect.replace('<w:titlePg/>', '');
    const box = blind && !(S.opt && S.opt.blindBox === false) ? d.slice(bodyOpen, mStart) : '';
    const mast = d.slice(mStart, mEnd).replace('ARTIKEL PENELITIAN / RESEARCH ARTICLE', esc(typeOf(S).mast));
    const out = d.slice(0, bodyOpen) + box + mast + frontXml(S, L, blind) + abstractTable(S, L) + sb[0] + body + finalSect + '</w:body></w:document>';
    zip.file('word/document.xml', out);
    /* media */
    if (ctx.media.length) {
      let rels = await zip.file('word/_rels/document.xml.rels').async('string');
      let ct = await zip.file('[Content_Types].xml').async('string');
      for (const m of ctx.media) {
        zip.file('word/' + m.name, m.b64, { base64: true });
        rels = rels.replace('</Relationships>', `<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${m.name}"/></Relationships>`);
        const e = m.ext === 'jpeg' ? 'jpg' : 'png';
        if (!new RegExp(`Extension="${e}"`, 'i').test(ct)) ct = ct.replace('<Default ', `<Default Extension="${e}" ContentType="image/${m.ext}"/><Default `);
      }
      zip.file('word/_rels/document.xml.rels', rels); zip.file('[Content_Types].xml', ct);
    }
    /* header/footer */
    const rep = async (f, fn) => { const p = 'word/' + f; if (zip.file(p)) zip.file(p, fn(await zip.file(p).async('string'))); };
    const run_ = (S.running || '').trim();
    await rep('header1.xml', s => s.replace(/\[Judul singkat, maks\. 60 karakter\]|\[Short title, max\. 60 characters\]/, () => esc(run_)));
    if (!blind) {
      await rep('header2.xml', s => s.replace(/\[[^\]]*\](?: et al\.)?(?=<\/w:t>)/, () => esc(headerName(S))));
      const ca = S.authors[S.corr || 0] || {};
      const aff = (S.affs[((ca.affs || [1])[0] || 1) - 1] || '').trim();
      const tel = (S.phone || '').trim();
      await rep('footer3.xml', s => s
        .replace(/\[(?:Nama lengkap penulis korespondensi|Full name of corresponding author)\]/, () => esc((ca.name || '').trim() || '—'))
        .replace(/\[(?:Departemen, Fakultas, Universitas, Kota, Kode Pos, Negara|Department, Faculty, University, City, ZIP Code, Country)\]/, () => esc(aff || '—'))
        .replace(/Tel \((?:opsional|optional)\): \[\+62-XXXXXXXXXXX\], E-mail: \[[^\]]*\]/, () => esc((tel ? L.tel + tel + ', ' : '') + 'E-mail: ' + ((ca.email || '').trim() || '—'))));
    }
    return finish(zip, S, S.titleEn || S.titleId, blind);
  }

    const tc = (w, t, f, shade, jc) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:tcBorders></w:tcBorders><w:shd w:color="auto" w:fill="${shade || 'FFFFFF'}" w:val="clear"/></w:tcPr>` + para(run(t, f), { before: 20, after: 20, jc: jc || 'center' }) + '</w:tc>';

  async function build(kind, S, TPL) {
    if (kind === 'title') return buildTitlePage(S, TPL);
    return buildManuscript(S, TPL, kind);
  }

  /* ---------- checks ---------- */
  function check(S) {
    const out = []; const add = (sev, step, msg) => out.push({ sev, step, msg });
    const L = LBL[S.lang === 'en' ? 'en' : 'id'];
    const wc = words;
    const T = typeOf(S); const cc = corrCountry(S); const needId = cc !== 'other';
    if (!(S.titleId || '').trim()) add('need', 'judul', 'Judul bahasa Indonesia belum diisi.');
    else if (wc(S.titleId) > 20) add('need', 'judul', `Judul bahasa Indonesia ${wc(S.titleId)} kata; maksimal 20 kata.`);
    if (!(S.titleEn || '').trim()) add('need', 'judul', 'Judul bahasa Inggris belum diisi.');
    else if (wc(S.titleEn) > 20) add('need', 'judul', `Judul bahasa Inggris ${wc(S.titleEn)} kata; maksimal 20 kata.`);
    const rl = stripMarkup(S.running || '').length;
    if (!rl) add('need', 'judul', 'Judul singkat (running title) belum diisi; dipakai pada header halaman genap.');
    else if (rl > 60) add('need', 'judul', `Judul singkat ${rl} karakter; maksimal 60 karakter.`);
    const A = S.authors.filter(a => (a.name || '').trim());
    if (!A.length) add('need', 'penulis', 'Belum ada nama penulis. Nama dipakai pada Title Page; naskah blind review tidak memuatnya.');
    const titleRe = /\b(?:Dr|Prof|Drs|Dra|Ir)\.?(?=[\s,]|$)|\b[SM]\.(?:Pi|Kel|Si|Sc|Pd|T|E|Hut|Kom|Ak|Mar)\b|\bPh\.?D\b/;
    A.forEach(a => { if (titleRe.test(a.name)) add('tip', 'penulis', `Nama “${a.name.trim()}” tampak memuat gelar; tulis nama lengkap tanpa gelar.`); });
    A.forEach(a => { if (!(a.affs || []).length) add('need', 'penulis', `Penulis “${a.name.trim()}” belum dikaitkan dengan afiliasi.`); if (!(a.email || '').trim()) add('need', 'penulis', `E-mail untuk “${a.name.trim()}” belum diisi (wajib di Title Page).`); });
    if (A.length && !(S.affs || []).some(x => (x || '').trim())) add('need', 'penulis', 'Afiliasi belum diisi.');
    const ca = S.authors[S.corr || 0];
    if (A.length && (!ca || !(ca.name || '').trim())) add('need', 'penulis', 'Penulis korespondensi belum dipilih.');
    if (A.length && cc === null) add('need', 'penulis', 'Negara afiliasi penulis korespondensi belum ditentukan (Indonesia atau luar Indonesia). Pilihan ini menentukan apakah abstrak bahasa Indonesia diperlukan.');
    const ae = wc(S.absEn), ai = wc(S.absId); const [lo, hi] = T.abs;
    const ke = keywords(S.kwEn).length, ki = keywords(S.kwId).length;
    if (!ae) add('need', 'abstrak', 'Abstract (bahasa Inggris) belum diisi.'); else if (ae < lo || ae > hi) add('need', 'abstrak', `Abstract ${ae} kata; ${T.id} wajib ${lo}–${hi} kata.`);
    if (!ke) add('need', 'abstrak', 'Keywords (bahasa Inggris) belum diisi.'); else if (ke < 4 || ke > 6) add('need', 'abstrak', `Keywords ${ke} buah; wajib 4–6.`);
    if (needId) {
      if (!ai) add('need', 'abstrak', 'Penulis korespondensi berafiliasi di Indonesia: Abstrak bahasa Indonesia wajib diisi, juga untuk naskah berbahasa Inggris.'); else if (ai < lo || ai > hi) add('need', 'abstrak', `Abstrak ${ai} kata; ${T.id} wajib ${lo}–${hi} kata.`);
      if (!ki) add('need', 'abstrak', 'Penulis korespondensi berafiliasi di Indonesia: Kata kunci bahasa Indonesia wajib diisi.'); else if (ki < 4 || ki > 6) add('need', 'abstrak', `Kata kunci ${ki} buah; wajib 4–6.`);
    } else if (ai || ki) add('tip', 'abstrak', 'Penulis korespondensi berafiliasi di luar Indonesia: Abstrak dan Kata kunci bahasa Indonesia tidak diperlukan dan tidak akan dimasukkan ke naskah.');
    /* body */
    const keys = ['intro', 'methods', 'results', 'disc', 'concl'];
    const refList = getRefs(S); const refIdx = buildRefIndex(refList);
    const cited = new Set(); const missing = new Map();
    let seen = ''; let nT = 0, nF = 0; const unref = []; const idTab = [];
    let dec = 0;
    keys.forEach((k, si) => {
      const bl = (S.sections && S.sections[k]) || [];
      const n = bl.filter(b => b.t === 'p' && (b.text || '').trim()).length;
      if (!n) add('need', 'isi', `Bagian “${L.sec[si]}” belum berisi paragraf.`);
      if (k === 'concl') { const w = bl.filter(b => b.t === 'p').reduce((s, b) => s + wc(b.text), 0); if (w > 150) add('tip', 'isi', `Simpulan ${w} kata (disarankan maksimal 150).`); }
      bl.forEach(b => {
        if (b.t === 'p') {
          const plain = stripMarkup(b.text || '');
          citeSpans(plain, refIdx).forEach(sp => { if (sp.noCount || sp.semi) return; if (sp.ref) cited.add(sp.ref.n); else missing.set(sp.label, 1); });
          dec += (S.lang === 'en' ? (plain.match(/\b\d+,\d{1,2}\b(?!\d)/g) || []) : (plain.match(/(?<![\d.])\d+\.\d{1,2}\b(?![\d.])/g) || [])).length;
          seen += ' ' + plain;
        } else if (b.t === 'table' && (b.rows || []).some(r => r.some(c => (c || '').trim()))) {
          nT++; const re = new RegExp('\\b(?:Tabel|Table)\\s*' + nT + '\\b', 'i'); if (!re.test(seen)) unref.push(`${L.table} ${nT}`);
          if (ID_TAB_RE.test(b.rows.map(r => r.join(' ')).join(' '))) idTab.push(`${L.table} ${nT}`);
          seen += ' ' + (b.cap || '');
        } else if (b.t === 'fig' && b.img && b.img.data) {
          nF++; const re = new RegExp('\\b(?:Gambar|Figure)\\s*' + nF + '\\b', 'i'); if (!re.test(seen)) unref.push(`${L.figure} ${nF}`);
          seen += ' ' + (b.cap || '');
        }
      });
    });
    if (idTab.length) add('tip', 'isi', `Teks di dalam ${idTab.join(', ')} tampak berbahasa Indonesia; teks di dalam tabel dan gambar ditulis dalam bahasa Inggris.`);
    if (unref.length) add('tip', 'isi', `Belum dirujuk dalam teks sebelum kemunculannya: ${unref.join(', ')}.`);
    if (dec) add('tip', 'isi', S.lang === 'en' ? `${dec} angka tampak memakai koma desimal; naskah Inggris memakai titik (28.4).` : `${dec} angka tampak memakai titik desimal; naskah Indonesia memakai koma (28,4).`);
    /* closing */
    S.authors.forEach((a, i) => { if (!(a.roles || []).length) add('need', 'pernyataan', `Peran CRediT untuk ${(a.name || '').trim() ? '“' + a.name.trim() + '”' : 'Penulis ' + (i + 1)} belum dipilih.`); });
    if (S.aiUse === 'yes' && !(S.aiText || '').trim()) add('need', 'pernyataan', 'Anda memilih “menggunakan AI” tetapi uraiannya kosong.');
    /* refs */
    if (!refList.length) add('need', 'pustaka', 'Daftar pustaka belum diisi.');
    else {
      if (refList.length < T.refs) add('need', 'pustaka', `Daftar pustaka ${refList.length} rujukan; ${T.id} minimal ${T.refs} rujukan.`);
      const yr = new Date().getFullYear() - 10; let rec = 0, doi = 0;
      refList.forEach(r => { const m = stripMarkup(r).match(/\(((?:19|20)\d{2})[a-z]?\)/) || stripMarkup(r).match(/\b((?:19|20)\d{2})\b/); if (m && +m[1] >= yr) rec++; if (/doi\.org\//i.test(r)) doi++; });
      const pct = Math.round(100 * rec / refList.length);
      if (pct < 70) add('tip', 'pustaka', `${pct}% rujukan terbit ${yr}–sekarang (disarankan minimal 70%).`);
      if (doi < refList.length) add('tip', 'pustaka', `${refList.length - doi} rujukan belum mencantumkan DOI.`);
      if (missing.size) add('tip', 'pustaka', `Sitiran tanpa entri di daftar pustaka: ${[...missing.keys()].slice(0, 6).join('; ')}${missing.size > 6 ? ' …' : ''}.`);
      const unc = refIdx.filter(r => !cited.has(r.n));
      if (unc.length && cited.size) add('tip', 'pustaka', `${unc.length} rujukan belum disitir dalam teks.`);
    }
    return out;
  }

  function emptyState(lang) {
    const p = () => ({ t: 'p', text: '' });
    return {
      v: 1, lang: lang || 'id', type: 'original', corrCountry: '', titleId: '', titleEn: '', running: '', ojsId: '',
      authors: [{ name: '', affs: [1], email: '', orcid: '', roles: [] }], affs: [''], corr: 0, phone: '', corrAddress: '', headerName: '',
      absEn: '', kwEn: '', absId: '', kwId: '',
      sections: {
        intro: [p()],
        methods: [{ t: 'h2', text: lang === 'en' ? 'Study period and location' : 'Waktu dan lokasi penelitian' }, p(), { t: 'h2', text: lang === 'en' ? 'Data collection' : 'Pengumpulan data' }, p(), { t: 'h2', text: lang === 'en' ? 'Data analysis' : 'Analisis data' }, p()],
        results: [p()], disc: [p()], concl: [p()]
      },
      aiUse: 'none', aiText: '', closing: { coi: '', fund: '', ack: '', data: '', ethics: '' }, refs: '',

  if(need.length) sec.append(h('h3',{text:'Perlu dilengkapi ('+need.length+')',style:'margin:8px 0'}),h('ul',{class:'cl'},...need.map(li)));
  if(tip.length) sec.append(h('h3',{text:'Saran perapian ('+tip.length+')',style:'margin:8px 0'}),h('ul',{class:'cl'},...tip.map(li)));
  /* downloads */
  const dl=h('div',{class:'dl'});
  const mk=(kind,title,desc,fname,primary)=>{
    const st=h('small',{'data-keep':kind,text:keep[kind]||''});
    const b=h('button',{class:'btn'+(primary?' primary':''),type:'button'},'↓ Unduh .docx');
    b.addEventListener('click',async()=>{ if(gate(b,st)) return; b.disabled=true; st.textContent='Membuat berkas…'; try{ const buf=await PLX.build(kind,S,TPL); const ok=await saveFile(fname,new Blob([buf],{type:DOCX})); st.textContent=ok?'Selesai.':'Dibatalkan.'; }catch(e){ console.error(e); st.textContent='Gagal membuat berkas: '+(e.message||e); } b.disabled=false; });
    return h('div',{class:'item'},h('div',{},h('b',{text:title}),h('small',{text:desc}),st),b);
  };
  const en=S.lang==='en';
  sec.append(h('h3',{text:'Untuk pengiriman awal ke OJS',style:'margin:22px 0 8px'}));
  sec.append(h('label',{class:'checks',style:'margin:0 0 10px'},h('input',{type:'checkbox',checked:S.opt.blindBox!==false,onchange:e=>{S.opt.blindBox=e.target.checked;setDirty();}}),'Sertakan kotak peringatan blind review di bagian atas naskah (hapus sebelum mengunggah ke OJS)'));
  dl.append(mk('blind','Naskah utama (blind review)','Tanpa nama penulis, afiliasi, ucapan terima kasih, sumber dana, kontribusi penulis, dan ORCID. '+(PLX.needsIdAbstract(S)?'Memuat abstract Inggris dan abstrak Indonesia. ':'Hanya memuat abstract Inggris. ')+'Unggah sebagai Main Manuscript.',en?'PLATAX_Manuscript_BlindReview.docx':'PLATAX_Naskah_BlindReview.docx',true));
  dl.append(mk('title','Title Page','Identitas penulis, korespondensi, CRediT, dan pernyataan. Unggah terpisah sebagai Supplementary File.','PLATAX_Title_Page.docx',true));
  const zb=h('button',{class:'btn',type:'button'},'↓ Unduh keduanya (.zip)'); const zst=h('small',{'data-keep':'zip',text:keep.zip||''});
  zb.addEventListener('click',async()=>{ if(gate(zb,zst)) return; zb.disabled=true; zst.textContent='Membuat berkas…'; try{ const z=new JSZip(); z.file(en?'PLATAX_Manuscript_BlindReview.docx':'PLATAX_Naskah_BlindReview.docx',await PLX.build('blind',S,TPL)); z.file('PLATAX_Title_Page.docx',await PLX.build('title',S,TPL)); const buf=await z.generateAsync({type:'uint8array',compression:'DEFLATE'}); const ok=await saveFile('PLATAX_Pengiriman_Awal.zip',new Blob([buf],{type:'application/zip'})); zst.textContent=ok?'Selesai.':'Dibatalkan.'; }catch(e){ zst.textContent='Gagal: '+(e.message||e); } zb.disabled=false; });
  dl.append(h('div',{class:'item'},h('div',{},h('b',{text:'Keduanya sekaligus'}),h('small',{text:'Naskah blind review dan Title Page dalam satu berkas zip.'}),zst),zb));
  sec.append(dl);
  sec.append(h('h3',{text:'Setelah naskah diterima',style:'margin:22px 0 8px'}),h('div',{class:'dl'},
    mk('full','Naskah lengkap (dengan identitas penulis)','Dipakai ketika redaksi meminta naskah akhir yang memuat nama, afiliasi, dan ucapan terima kasih.',en?'PLATAX_Manuscript_Full.docx':'PLATAX_Naskah_Lengkap.docx',false)));
  sec.append(h('div',{class:'note',style:'margin-top:18px'},h('b',{text:'Setelah berkas terunduh'}),'Buka di Microsoft Word dan periksa tampilan. ',TEXT.editorial,' Sebelum mengunggah ke OJS, bersihkan metadata Word pada naskah blind review (File → Info → Periksa Dokumen).'));
  sec.append(h('div',{class:'card'},h('h3',{text:'Cadangan'}),h('p',{class:'hint',text:'Unduh draf agar isian dapat dimuat lagi kapan saja.'}),h('button',{class:'btn',type:'button',onclick:downloadDraft},'↓ Simpan draf (.json)')));
  /* feedback */
  const times=Object.entries(S.stepTime||{}).filter(([k,v])=>v>0); const notes=Object.entries(S.notes||{}).filter(([k,v])=>(v||'').trim());
  const summary='Ringkasan penggunaan generator\n'+(times.length?times.map(([k,v])=>'- '+(STEPNAME[k]||k)+': '+Math.floor(v/60)+' mnt '+(v%60)+' dtk').join('\n'):'- (belum ada data waktu)')+'\n\nCatatan kendala\n'+(notes.length?notes.map(([k,v])=>'- '+(STEPNAME[k]||k)+': '+v.trim()).join('\n'):'- (tidak ada)');
  const fb=h('details',{class:'card'},h('summary',{style:'cursor:pointer;font-weight:600',text:'Bantu redaksi menyempurnakan generator'}),
    h('p',{class:'hint',style:'margin-top:8px',text:'Salin ringkasan di bawah ini dan kirim ke platax@unsrat.ac.id. Isinya hanya waktu per langkah dan catatan kendala Anda, tanpa isi naskah.'}),
    h('pre',{class:'out',text:summary}),
    h('button',{class:'btn small',type:'button',onclick:async()=>{ try{ await navigator.clipboard.writeText(summary); toast('Ringkasan disalin.'); }catch(e){ const r=document.createRange(); r.selectNodeContents(fb.querySelector('pre')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Pilih dan salin teks yang tersorot.'); } }},'Salin ringkasan'));
  sec.append(fb);
  sec.append(h('div',{class:'row',style:'margin-top:18px'},h('button',{class:'btn',type:'button',onclick:()=>go('pustaka')},'← '+STEPS[6][1])));
}

/* ---------- boot ---------- */
function renderAll(){
  counters=[];
  const main=$('#main'); main.textContent='';
  main.append(buildMulai(),buildJudul(),buildPenulis(),buildAbstrak(),buildIsi(),buildPernyataan(),buildPustaka(),buildHasil());
  renderMulai(); renderPenulis(); renderIsi(); renderPernyataan(); renderRefInfo();
  document.querySelectorAll('.main>section').forEach(s=>s.classList.toggle('on',s.id==='s-'+step));
  syncAbstractUI(); renderSteps(); if(step==='hasil') renderResult(); updateSaveState();
}
$('#btnSaveDraft').addEventListener('click',downloadDraft);
$('#btnLoadDraft').addEventListener('click',()=>$('#fileDraft').click());
$('#fileDraft').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadDraftFile(f); e.target.value=''; });
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); if(STEPS.some(s=>s[0]===id)&&id!==step) go(id); });
try{ const r=localStorage.getItem(LS_KEY); if(r){ const o=JSON.parse(r); if(o&&o.S&&o.S.v===1){ S=PLX.emptyState('id'); adoptQuiet(o.S); if(hasContent()){ restoredAt=o.savedAt||Date.now(); } else S=PLX.emptyState('id'); } } }catch(e){ S=PLX.emptyState('id'); }
renderAll();
const h0=location.hash.slice(1); if(STEPS.some(s=>s[0]===h0)&&h0!=='mulai') go(h0);
window.PLXAPP={get state(){return S;},set state(v){S=v;renderAll();},go,renderAll};
})();
</script>
